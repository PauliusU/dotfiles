# herdr-navigator-custom overrides — merged over plugin defaults (missing keys inherit)
# Full option reference: examples/default-config.toml in the herdr-navigator plugin repo

[picker]
create_missing = false
# "tab" is a custom-fork-only source, not upstream herdr-navigator
source_order = ["agent", "workspace", "tab", "project", "zoxide", "root", "server", "quick", "plugin", "session"]
agent_sort = "priority"

[jump_back]
pin_previous = false

[sources]
herdr_plus_projects = false
zoxide = false
roots = false
servers = false
herdr_plus_quick_actions = false
