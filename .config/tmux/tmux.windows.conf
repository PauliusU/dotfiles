# Windows: psmux (github.com/marlocarlo/psmux) provides tmux-compatible multiplexer.
# Linked to %USERPROFILE%\.tmux.conf by setup-windows/dev-1-shells-ides.setup.bat.
# macOS uses .config/tmux/tmux.conf.

# Use Git Bash in Scoop for shell commands spawned by psmux.
set -g default-shell "D:/soft/scoop/apps/git/current/bin/bash.exe"

# Count windows and panes from 1 (match tmux config)
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Remap prefix to Ctrl+A (match tmux config)
set -g prefix C-a

# Navigate windows: Shift+Left/Right (no prefix needed)
bind-key -n S-Left previous-window
bind-key -n S-Right next-window

# Move between windows: Alt+Shift+J/K (match macOS tmux config)
bind-key -n M-J previous-window
bind-key -n M-K next-window

# Create new window: Alt+N (no prefix needed)
bind-key -n M-n new-window

# Create panes: Shift+Up (vertical split), Shift+Down (horizontal split)
bind-key -n S-Up split-window -h
bind-key -n S-Down split-window -v

# Close pane (no prefix needed)
# NOTE 2026-03-08: M-w and M-c are silently ignored by psmux v0.4.5 despite valid syntax.
# Confirmed via `psmux list-keys` — only M-n loads in root table. Likely psmux bug.
bind-key -n M-w kill-pane
bind-key -n M-c kill-pane
bind-key -n M-x kill-pane

# Session switcher: Ctrl+F (no prefix needed)
bind-key -n C-f run-shell "tmux-sessionizer"

# Close pane with prefix: rebind to skip confirmation prompt
bind-key x kill-pane
